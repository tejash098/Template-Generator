<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdf8f3" />
    <title>Shri Ram Bus Service — Bookings</title>
    <!-- Relative URLs on purpose: the build uses base './' and is also loaded from file:// in the shells. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      // Applies the persisted theme and UI language before the first paint.
      // ThemeProvider / LocaleProvider set these in effects (after React
      // mounts), so without this the page would flash light on every load for
      // dark-theme users. Reads localStorage only, mirroring the providers.
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark')
        var locale = localStorage.getItem('srbs.locale')
        if (locale === 'hi' || locale === 'en') document.documentElement.lang = locale
      } catch (e) {
        /* storage blocked: defaults apply */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
